name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Lint Python services ─────────────────────────────────────────────
  lint-python:
    name: Lint Python (ai, rag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint ai service
        run: flake8 services/ai --max-line-length=120 --ignore=E501

      - name: Lint rag service
        run: flake8 services/rag --max-line-length=120 --ignore=E501

  # ── Job 2: Build Java services ───────────────────────────────────────────────
  build-java:
    name: Build Java (auth, user)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build auth service
        working-directory: services/auth
        run: ./mvnw package -DskipTests -q

      - name: Build user service
        working-directory: services/user
        run: ./mvnw package -DskipTests -q

  # ── Job 3: Health-check integration test ────────────────────────────────────
  health-check:
    name: Docker Compose Health Check
    runs-on: ubuntu-latest
    needs: [lint-python, build-java]
    steps:
      - uses: actions/checkout@v4

      - name: Start all services
        run: docker compose up --build -d

      - name: Wait for services to be healthy (90s max)
        run: |
          echo "Waiting for containers to become healthy..."
          for i in $(seq 1 18); do
            UNHEALTHY=$(docker compose ps --format json \
              | python3 -c "
import sys, json
data = [json.loads(l) for l in sys.stdin if l.strip()]
print(sum(1 for s in data if s.get('Health','') not in ('healthy', '')))
")
            echo "Attempt $i: $UNHEALTHY container(s) not yet healthy"
            if [ "$UNHEALTHY" -eq 0 ]; then
              echo "All containers healthy!"
              break
            fi
            sleep 5
          done

      - name: Verify gateway /health
        run: |
          curl -sf http://127.0.0.1/health | grep "gateway ok"

      - name: Verify auth service health via gateway
        run: |
          curl -sf http://127.0.0.1/api/v1/auth/health | grep '"status":"ok"'

      - name: Verify user service health via gateway
        run: |
          curl -sf http://127.0.0.1/api/v1/users/health | grep '"status":"ok"'

      - name: Verify ai service health via gateway
        run: |
          curl -sf http://127.0.0.1/api/v1/ai/health | grep '"status":"ok"'

      - name: Verify rag service health via gateway
        run: |
          curl -sf http://127.0.0.1/api/v1/rag/health | grep '"status":"ok"'

      - name: Print container status (debug)
        if: always()
        run: docker compose ps

      - name: Print logs on failure (debug)
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down
