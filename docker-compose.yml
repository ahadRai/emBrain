services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: embrain
      POSTGRES_USER: embrain
      POSTGRES_PASSWORD: embrain_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embrain"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - user
      - ai
      - rag
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build: ./services/auth
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/embrain
      DB_USER: embrain
      DB_PASS: embrain_dev
      JWT_SECRET: change_me_in_production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  user:
    build: ./services/user
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/embrain
      DB_USER: embrain
      DB_PASS: embrain_dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai:
    build: ./services/ai
    environment:
      RAG_HOST: rag
      RAG_PORT: 50051
    depends_on:
      - rag
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  rag:
    build: ./services/rag
    environment:
      VECTOR_DB_URL: ""
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Phase 1 placeholder: Next.js app will be scaffolded in Phase 2 ──────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: node -e "const h=require('http');h.createServer((_,r)=>{r.writeHead(200,{'Content-Type':'application/json'});r.end(JSON.stringify({status:'ok',service:'frontend'}))}).listen(3000,()=>console.log('Frontend placeholder on :3000'))"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
