events { worker_connections 1024; }

http {

  # ── Rate limiting ───────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;

  # ── Upstreams ───────────────────────────────────────────────────────────────
  upstream auth_service { server auth:8081; }
  upstream user_service { server user:8082; }
  upstream ai_service   { server ai:8083;   }
  upstream rag_service  { server rag:8084;  }

  server {
    listen 80;

    # ── Internal auth validation sub-request (used by auth_request) ──────────
    location = /internal/validate {
      internal;
      proxy_pass http://auth_service/validate;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Original-URI $request_uri;
    }

    # ── Gateway health ────────────────────────────────────────────────────────
    location = /health {
      return 200 'gateway ok\n';
      add_header Content-Type text/plain;
    }

    # ── Auth service — public endpoints (no JWT required) ─────────────────────
    location = /api/v1/auth/register {
      proxy_pass http://auth_service/register;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/auth/login {
      limit_req zone=auth_login burst=3 nodelay;
      limit_req_status 429;
      proxy_pass http://auth_service/login;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/auth/refresh {
      proxy_pass http://auth_service/refresh;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/auth/logout {
      proxy_pass http://auth_service/logout;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Auth service catch-all (health etc.)
    location /api/v1/auth/ {
      proxy_pass http://auth_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── User service — protected (JWT validated at gateway) ───────────────────
    location /api/v1/users/ {
      auth_request /internal/validate;
      auth_request_set $x_user_id   $upstream_http_x_user_id;
      auth_request_set $x_user_role $upstream_http_x_user_role;

      proxy_pass http://user_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-User-Id   $x_user_id;
      proxy_set_header X-User-Role $x_user_role;

      # Pass 401 from auth_request back to client
      error_page 401 = @unauthorized;
    }

    # ── AI service — protected ────────────────────────────────────────────────
    location /api/v1/ai/ {
      auth_request /internal/validate;
      auth_request_set $x_user_id   $upstream_http_x_user_id;
      auth_request_set $x_user_role $upstream_http_x_user_role;

      proxy_pass http://ai_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-User-Id   $x_user_id;
      proxy_set_header X-User-Role $x_user_role;

      error_page 401 = @unauthorized;
    }

    # ── RAG service — protected ───────────────────────────────────────────────
    location /api/v1/rag/ {
      auth_request /internal/validate;
      auth_request_set $x_user_id   $upstream_http_x_user_id;

      proxy_pass http://rag_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-User-Id $x_user_id;

      error_page 401 = @unauthorized;
    }

    # ── 401 handler ───────────────────────────────────────────────────────────
    location @unauthorized {
      return 401 '{"error":"Unauthorized","message":"Valid JWT required"}\n';
      add_header Content-Type application/json always;
    }
  }
}
